name: Bootstrap Steel image digest

on:
  workflow_dispatch:
  push:
    branches:
      - gate-1-steel-local

permissions:
  contents: write

concurrency:
  group: gate-1-steel-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pull current Steel image
        run: docker pull ghcr.io/steel-dev/steel-browser:latest

      - name: Resolve immutable digest
        id: steel
        shell: bash
        run: |
          IMAGE="$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/steel-dev/steel-browser:latest)"
          test -n "$IMAGE"
          echo "Resolved $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          mkdir -p infra
          printf '%s\n' "$IMAGE" > infra/steel-image.txt

      - name: Smoke-test resolved image
        shell: bash
        run: |
          docker run -d --rm \
            --name astra-steel-bootstrap \
            -p 3000:3000 \
            -p 9223:9223 \
            -e DOMAIN=localhost:3000 \
            -e CDP_DOMAIN=localhost:9223 \
            "${{ steps.steel.outputs.image }}"

          trap 'docker logs astra-steel-bootstrap || true; docker stop astra-steel-bootstrap || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/v1/health >/dev/null; then
              echo "Steel is healthy."
              exit 0
            fi
            sleep 2
          done

          echo "Steel failed to become healthy." >&2
          exit 1

      - name: Commit pinned digest
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- infra/steel-image.txt)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add infra/steel-image.txt
            git commit -m "chore: pin tested Steel image digest"
            git push
          else
            echo "Steel digest is already pinned."
          fi
