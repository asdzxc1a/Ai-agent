name: Bootstrap Gate 2 lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - gate-2-stagehand-steel

permissions:
  contents: write

concurrency:
  group: gate-2-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Update lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Validate non-browser quality gates
        run: pnpm check

      - name: Commit updated lockfile
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update lockfile for Gate 2"
            git push
          else
            echo "pnpm-lock.yaml is already current."
          fi
