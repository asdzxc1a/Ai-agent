name: Bootstrap PostgreSQL image digest

on:
  workflow_dispatch:
  push:
    branches:
      - gate-5-postgres-durability

permissions:
  contents: write

concurrency:
  group: gate-5-postgres-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pull PostgreSQL 18.6 image
        run: docker pull postgres:18.6-alpine

      - name: Resolve immutable digest
        id: postgres
        shell: bash
        run: |
          IMAGE="$(docker inspect --format='{{index .RepoDigests 0}}' postgres:18.6-alpine)"
          test -n "$IMAGE"
          echo "Resolved $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          mkdir -p infra
          printf '%s\n' "$IMAGE" > infra/postgres-image.txt

      - name: Smoke-test resolved PostgreSQL
        shell: bash
        run: |
          docker run -d --rm \
            --name astra-postgres-bootstrap \
            -e POSTGRES_PASSWORD=astra \
            -e POSTGRES_DB=astra \
            "${{ steps.postgres.outputs.image }}"

          trap 'docker logs astra-postgres-bootstrap || true; docker stop astra-postgres-bootstrap || true' EXIT

          for attempt in $(seq 1 60); do
            if docker exec astra-postgres-bootstrap pg_isready -U postgres -d astra >/dev/null 2>&1; then
              echo "PostgreSQL is healthy."
              exit 0
            fi
            sleep 1
          done

          echo "PostgreSQL failed to become healthy." >&2
          exit 1

      - name: Commit pinned digest
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- infra/postgres-image.txt)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add infra/postgres-image.txt
            git commit -m "chore: pin tested PostgreSQL image digest"
            git push
          else
            echo "PostgreSQL digest is already pinned."
          fi
