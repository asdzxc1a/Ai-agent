name: Resolve Steel image digest

on:
  push:
    branches:
      - gate-1-steel-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pull Steel image
        run: docker pull ghcr.io/steel-dev/steel-browser:latest

      - name: Print immutable digest
        run: docker image inspect --format='{{index .RepoDigests 0}}' ghcr.io/steel-dev/steel-browser:latest
