name: Bootstrap Gate 0 lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - gate-0-workspace-ci

permissions:
  contents: write

concurrency:
  group: gate-0-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 12.4.2
          runtime: node@24.21.0
          install: false

      - name: Install dependencies and generate lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit generated lockfile
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- pnpm-lock.yaml)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: generate pnpm lockfile"
            git push
          else
            echo "pnpm-lock.yaml is already current."
          fi
