name: Stagehand Steel integration

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/agent-stagehand/**"
      - "packages/agent-loop/**"
      - "packages/artifact-store/**"
      - "packages/browser-runtime/**"
      - "packages/browser-steel/**"
      - "packages/contracts/**"
      - "packages/prospect-research/**"
      - "packages/prospect-postgres/**"
      - "packages/run-engine/**"
      - "packages/sales-domain/**"
      - "packages/sandbox-runtime/**"
      - "packages/run-postgres/**"
      - "apps/api/**"
      - "apps/gate13-operator/**"
      - "test-sites/**"
      - "infra/steel-image.txt"
      - "infra/postgres-image.txt"
      - "vitest.stagehand.config.ts"
      - "vitest.postgres.config.ts"
      - "vitest.api-restart.config.ts"
      - "vitest.api-sse.config.ts"
      - "vitest.api-browser.config.ts"
      - ".github/workflows/stagehand-steel-integration.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/agent-stagehand/**"
      - "packages/agent-loop/**"
      - "packages/browser-steel/**"
      - "packages/prospect-research/**"
      - "packages/prospect-postgres/**"
      - "packages/run-engine/**"
      - "packages/sales-domain/**"
      - "packages/sandbox-runtime/**"
      - "apps/api/**"
      - "apps/gate13-operator/**"
      - "test-sites/**"
      - "infra/steel-image.txt"
      - "infra/postgres-image.txt"
      - "vitest.stagehand.config.ts"
      - "vitest.postgres.config.ts"
      - "vitest.api-restart.config.ts"
      - ".github/workflows/stagehand-steel-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stagehand-steel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stagehand-steel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start deterministic fixture
        shell: bash
        run: |
          node test-sites/simple-button/server.mjs > /tmp/astra-fixture.log 2>&1 &
          echo $! > /tmp/astra-fixture.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/health >/dev/null; then
              echo "Fixture is healthy."
              exit 0
            fi
            sleep 1
          done

          cat /tmp/astra-fixture.log || true
          echo "Fixture failed to become healthy." >&2
          exit 1

      - name: Start deterministic research fixture
        shell: bash
        run: |
          RESEARCH_FIXTURE_PORT=4174 node test-sites/research-flow/server.mjs > /tmp/astra-research-fixture.log 2>&1 &
          echo $! > /tmp/astra-research-fixture.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4174/health >/dev/null; then
              echo "Research fixture is healthy."
              exit 0
            fi
            sleep 1
          done

          cat /tmp/astra-research-fixture.log || true
          echo "Research fixture failed to become healthy." >&2
          exit 1

      - name: Start pinned Steel
        shell: bash
        run: |
          IMAGE="$(cat infra/steel-image.txt)"
          test -n "$IMAGE"

          docker pull "$IMAGE"

          docker run -d --rm \
            --name astra-steel-stagehand \
            --add-host=host.docker.internal:host-gateway \
            --add-host=blocked.docker.internal:host-gateway \
            --add-host=astra-public.test:host-gateway \
            -p 3000:3000 \
            -p 9223:9223 \
            -e DOMAIN=localhost:3000 \
            -e CDP_DOMAIN=localhost:9223 \
            -e CHROME_HEADLESS=true \
            "$IMAGE"

          docker run -d --rm \
            --name astra-steel-stagehand-secondary \
            --add-host=host.docker.internal:host-gateway \
            --add-host=blocked.docker.internal:host-gateway \
            --add-host=astra-public.test:host-gateway \
            -p 3001:3000 \
            -p 9224:9223 \
            -e DOMAIN=localhost:3001 \
            -e CDP_DOMAIN=localhost:9224 \
            -e CHROME_HEADLESS=true \
            "$IMAGE"

          for attempt in $(seq 1 60); do
            if \
              curl --fail --silent http://127.0.0.1:3000/v1/health >/dev/null && \
              curl --fail --silent http://127.0.0.1:3001/v1/health >/dev/null
            then
              echo "Both Steel endpoints are healthy."
              exit 0
            fi
            sleep 2
          done

          docker logs astra-steel-stagehand || true
          docker logs astra-steel-stagehand-secondary || true
          echo "Steel endpoints failed to become healthy." >&2
          exit 1

      - name: Start pinned PostgreSQL
        shell: bash
        run: |
          IMAGE="$(cat infra/postgres-image.txt)"
          test -n "$IMAGE"

          docker pull "$IMAGE"

          docker run -d --rm \
            --name astra-postgres \
            -p 5432:5432 \
            -e POSTGRES_PASSWORD=astra \
            -e POSTGRES_DB=astra \
            "$IMAGE"

          for attempt in $(seq 1 60); do
            if docker exec astra-postgres pg_isready -U postgres -d astra >/dev/null 2>&1; then
              echo "PostgreSQL is healthy."
              exit 0
            fi
            sleep 1
          done

          docker logs astra-postgres || true
          echo "PostgreSQL failed to become healthy." >&2
          exit 1

      - name: Run ten-session Stagehand → Steel acceptance test
        env:
          STEEL_BASE_URL: http://127.0.0.1:3000
          STEEL_SECONDARY_BASE_URL: http://127.0.0.1:3001
          STEEL_FIXTURE_URL: http://host.docker.internal:4173
        run: pnpm test:stagehand

      - name: Run HTTP API browser acceptance test
        env:
          STEEL_BASE_URL: http://127.0.0.1:3000
          STEEL_FIXTURE_URL: http://host.docker.internal:4173
        run: pnpm test:api-browser

      - name: Run PostgreSQL repository acceptance test
        env:
          TEST_DATABASE_URL: postgresql://postgres:astra@127.0.0.1:5432/astra
        run: pnpm test:postgres

      - name: Run replayable SSE acceptance test
        env:
          TEST_DATABASE_URL: postgresql://postgres:astra@127.0.0.1:5432/astra
        run: pnpm test:api-sse

      - name: Run durable API restart acceptance test
        env:
          TEST_DATABASE_URL: postgresql://postgres:astra@127.0.0.1:5432/astra
          STEEL_BASE_URL: http://127.0.0.1:3000
          STEEL_FIXTURE_URL: http://host.docker.internal:4173
        run: pnpm test:api-restart

      - name: Capture service logs on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Primary Steel logs ==="
          docker logs astra-steel-stagehand || true
          echo "=== Secondary Steel logs ==="
          docker logs astra-steel-stagehand-secondary || true
          echo "=== Fixture logs ==="
          cat /tmp/astra-fixture.log || true
          echo "=== Research fixture logs ==="
          cat /tmp/astra-research-fixture.log || true
          echo "=== PostgreSQL logs ==="
          docker logs astra-postgres || true

      - name: Cleanup services
        if: always()
        shell: bash
        run: |
          docker stop astra-steel-stagehand >/dev/null 2>&1 || true
          docker stop astra-steel-stagehand-secondary >/dev/null 2>&1 || true
          docker stop astra-postgres >/dev/null 2>&1 || true

          if [[ -f /tmp/astra-fixture.pid ]]; then
            kill "$(cat /tmp/astra-fixture.pid)" >/dev/null 2>&1 || true
          fi

          if [[ -f /tmp/astra-research-fixture.pid ]]; then
            kill "$(cat /tmp/astra-research-fixture.pid)" >/dev/null 2>&1 || true
          fi
