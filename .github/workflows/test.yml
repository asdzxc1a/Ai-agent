name: test

on:
  push:
    branches: [main, codex/sales-avatar-foundation]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit and Qwen BackendPort conformance tests
        run: npm test
