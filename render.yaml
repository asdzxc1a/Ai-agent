services:
  - type: web
    name: arcana-salesos
    runtime: node
    plan: free
    branch: codex/sales-avatar-foundation
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: QWEN_AUDIO_REALTIME_PROVIDER
        value: gpt-live
      - key: QWEN_AUDIO_AGENT_IDENTITY_MODE
        value: browser
      - key: QWEN_AUDIO_AGENT_ASSISTANT_PROFILE_PATH
        value: ./config/sales-assistant.md
      - key: SALES_REASONER_MODE
        value: mock
      - key: LIVEAVATAR_API_URL
        value: https://api.liveavatar.com
      - key: OPENAI_API_KEY
        sync: false
      - key: LIVEAVATAR_API_KEY
        sync: false
      - key: LIVEAVATAR_AVATAR_ID
        sync: false
